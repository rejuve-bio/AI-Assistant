name: CD - Deploy AI Assistant to Kubernetes (Staging Only)

on:
  repository_dispatch:
    types: [deploy-staging]

env:
  DOCKER_HUB_ORG: rejuvebio

jobs:
  deploy-dev:
    runs-on: [self-hosted, dev-runner]
    steps:
      - name: Debug workflow info
        run: |
          echo "Event Type: ${{ github.event.action }}"
          echo "Image Tag: ${{ github.event.client_payload.image_tag }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail

          NAMESPACE="ai-assistant-staging"
          IMAGE="${{ github.event.client_payload.image_tag }}"

          if [ -z "$IMAGE" ]; then
            IMAGE="${{ env.DOCKER_HUB_ORG }}/ai-assistant:staging"
          fi

          echo "Using image: $IMAGE"

          kubectl set image deployment/assistant-staging \
            assistant-staging=${IMAGE} \
            -n "$NAMESPACE"

          kubectl rollout restart deployment/assistant-staging -n "$NAMESPACE"

      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/assistant-staging -n ai-assistant-staging --timeout=180s

      - name: Verify pods
        run: |
          kubectl get pods -n ai-assistant-staging

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD SUCCESS - AI Assistant Deployed to Dev"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            AI Assistant deployed to the dev server successfully!
            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}
            Image: ${{ env.DOCKER_HUB_ORG }}/ai-assistant:staging
            Pods running in ai-assistant-staging namespace.
            Approve the deploy-staging job in this run to promote.

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD FAILED - AI Assistant Dev Deploy"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            AI Assistant dev deployment failed!
            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy-staging:
    needs: deploy-dev
    environment: production
    runs-on: [self-hosted, prod-runner]
    steps:
      - name: Debug workflow info
        run: |
          echo "Event Type: ${{ github.event.action }}"
          echo "Image Tag: ${{ github.event.client_payload.image_tag }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail

          NAMESPACE="ai-assistant-staging"
          IMAGE="${{ github.event.client_payload.image_tag }}"

          if [ -z "$IMAGE" ]; then
            IMAGE="${{ env.DOCKER_HUB_ORG }}/ai-assistant:staging"
          fi

          echo "Using image: $IMAGE"

          kubectl set image deployment/assistant-staging \
            assistant-staging=${IMAGE} \
            -n "$NAMESPACE"

          kubectl rollout restart deployment/assistant-staging -n "$NAMESPACE"

      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/assistant-staging -n ai-assistant-staging --timeout=180s

      - name: Verify pods
        run: |
          kubectl get pods -n ai-assistant-staging

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD SUCCESS - AI Assistant Deployed to Production"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            AI Assistant deployed to production successfully!
            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}
            Image: ${{ env.DOCKER_HUB_ORG }}/ai-assistant:staging
            Pods running in ai-assistant-staging namespace.

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD FAILED - AI Assistant Production Deploy"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            AI Assistant production deployment failed!
            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
