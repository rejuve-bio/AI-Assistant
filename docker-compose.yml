services:
  assistant:
    build: .
    volumes:
      - .:/AI-Assistant:rw
      - ./logfiles:/AI-Assistant/logfiles
      - static:/static
      - hf_cache:/root/.cache/huggingface
    ports:
      - "${FASTAPI_PORT}:${FASTAPI_PORT}"
    command: uvicorn run:asgi_app --host 0.0.0.0 --port $FASTAPI_PORT --workers 4 --log-level debug
    restart: always
    depends_on:
      - qdrant
      - redis
      - mongodb
    environment:
      - .env

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - vectordata:/qdrant/storage

  redis:
    image: redis:6-alpine
    restart: always
    ports:
      - "6378:6379"

  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db

volumes:
  vectordata:
  static:
  mongodb_data:
  hf_cache:
