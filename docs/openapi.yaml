      - total_count
      - pdf_count
      - web_count
      title: UserStatusDocumentsResponse
    V1FilesUploadErrorResponse:
      properties:
        text:
          type: string
          title: Text
          description: Summary error message.
        errors:
          items:
            $ref: '#/components/schemas/FileUploadError'
          type: array
          title: Errors
          description: Per-file upload errors.
      type: object
      required:
      - text
      title: V1FilesUploadErrorResponse
    V1FilesUploadResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UploadedFileItem'
          type: array
          title: Items
          description: Successfully stored files.
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/FileUploadError'
            type: array
          - type: 'null'
          title: Errors
          description: Per-file errors for any files in the batch that failed.
      type: object
      required:
      - items
      title: V1FilesUploadResponse
    V1Message:
      properties:
        id:
          type: string
          title: Id
          description: Stable message ID formatted as '{thread_id}_msg_{seq}'.
        thread_id:
          type: string
          title: Thread Id
          description: Parent thread UUID.
        role:
          type: string
          title: Role
          description: Sender role ('user', 'assistant', or 'system').
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
          description: UTC ISO-8601 timestamp (YYYY-MM-DDTHH:MM:SSZ).
        client_message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Message Id
          description: Client-supplied idempotency key, if any.
        parts:
          items:
            anyOf:
            - $ref: '#/components/schemas/TextPart'
            - $ref: '#/components/schemas/FilesPart'
            - $ref: '#/components/schemas/AboutPart'
            - $ref: '#/components/schemas/ProposalPart'
            - $ref: '#/components/schemas/QuickRepliesPart'
            - $ref: '#/components/schemas/ContextPart'
            - $ref: '#/components/schemas/RunPart'
          type: array
          title: Parts
          description: Ordered structured content parts.
      type: object
      required:
      - id
      - thread_id
      - role
      title: V1Message
      description: Canonical Threads v1 message object.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RecordRunFilesPart:
      properties:
        type:
          const: files
          default: files
          title: Type
          type: string
        files:
          description: Output files produced by the run.
          items:
            additionalProperties: true
            type: object
          title: Files
          type: array
      title: RecordRunFilesPart
      type: object
    RecordThreadRunRequest:
      description: Request body for POST /v1/threads/{thread_id}/messages.
      properties:
        client_message_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Optional idempotency key.
          title: Client Message Id
        parts:
          description: Must contain exactly one 'run' part, plus an optional 'files'
            part.
          items:
            anyOf:
            - $ref: '#/components/schemas/RunPart'
            - $ref: '#/components/schemas/RecordRunFilesPart'
          title: Parts
          type: array
      required:
      - parts
      title: RecordThreadRunRequest
      type: object
    RenameThreadRequest:
      description: Request body for PATCH /v1/threads/{thread_id}.
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: New custom thread title. Passing null or empty clears the custom
            title.
          title: Title
      title: RenameThreadRequest
      type: object
    SocketErrorEvent:
      description: Server -> Client `error` event emitted when validation or processing
        fails.
      properties:
        error:
          description: Error description.
          title: Error
          type: string
      required:
      - error
      title: SocketErrorEvent
      type: object
    SocketJoinRoomPayload:
      description: Client -> Server `join_room` event payload.
      properties:
        thread_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Optional thread ID. Joins room '{user_id}:{thread_id}' if set,
            else '{user_id}'.
          title: Thread Id
      title: SocketJoinRoomPayload
      type: object
    SocketQuestionPayload:
      description: Client -> Server `question` event payload.
      properties:
        question:
          description: User question text (required, non-empty).
          title: Question
          type: string
        thread_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Optional conversation thread ID used for room scoping and locking.
          title: Thread Id
      required:
      - question
      title: SocketQuestionPayload
      type: object
    SocketResponseEvent:
      description: Server -> Client `response` event emitted on connect, join_room,
        or final answer.
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: '''completed'' for question responses.'
          title: Status
        response:
          anyOf:
          - {}
          - type: 'null'
          default: null
          description: Final agent response or join confirmation string.
          title: Response
        message:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Connection acknowledgment message.
          title: Message
      title: SocketResponseEvent
      type: object
    SocketUpdateEvent:
      description: Server -> Client `update` event emitted during intermediate processing
        stages.
      properties:
        status:
          description: Status tag (e.g. 'update', 'completed', 'error').
          title: Status
          type: string
        response:
          description: Progress message string or structured response payload.
          title: Response
      required:
      - status
      - response
      title: SocketUpdateEvent
      type: object
    ThreadContextUpdateRequest:
      description: Request body for PUT /v1/threads/{thread_id}/context.
      properties:
        species:
          description: Target species (e.g. 'human', 'fly').
          title: Species
          type: string
        sources:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          description: Annotation data sources for the species; defaults to species
            defaults when omitted or empty.
          title: Sources
        resources:
          anyOf:
          - items:
              $ref: '#/components/schemas/ResourceRef'
            type: array
          - type: 'null'
          default: null
          description: Optional replacement list of context resources.
          title: Resources
      required:
      - species
      title: ThreadContextUpdateRequest
      type: object
    V1QueryAboutPart:
      properties:
        type:
          const: about
          default: about
          title: Type
          type: string
        kind:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Resource kind (e.g. 'annotation', 'hypothesis').
          title: Kind
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Resource identifier.
          title: Id
      title: V1QueryAboutPart
      type: object
    V1QueryContext:
      description: Initial thread context applied when `thread_id` is brand new.
      properties:
        species:
          anyOf:
          - type: string
          - type: 'null'
          default: human
          description: Target species (defaults to 'human').
          title: Species
        sources:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          description: Annotation sources validated against species schemas.
          title: Sources
      title: V1QueryContext
      type: object
    V1QueryFileRef:
      description: Reference either an already-uploaded file by `id` or a file attached
        to the multipart request by `name`.
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Existing content_id or File Service file ID.
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Filename matching an uploaded file part in a multipart/form-data
            request.
          title: Name
      title: V1QueryFileRef
      type: object
    V1QueryFilesPart:
      properties:
        type:
          const: files
          default: files
          title: Type
          type: string
        files:
          description: Files referenced by this message.
          items:
            $ref: '#/components/schemas/V1QueryFileRef'
          title: Files
          type: array
      title: V1QueryFilesPart
      type: object
    V1QueryRequest:
      description: JSON payload (or `body` field in multipart/form-data) for POST
        /v1/query.
      properties:
        thread_id:
          description: Client-generated UUIDv4 identifying the conversation thread.
          title: Thread Id
          type: string
        client_message_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Optional idempotency key; repeated requests return 200 with
            the stored message.
          title: Client Message Id
        context:
          anyOf:
          - $ref: '#/components/schemas/V1QueryContext'
          - type: 'null'
          default: null
          description: Optional context applied on the first message of a new thread.
        parts:
          description: Message parts. Must include at least one non-empty 'text' part.
          items:
            anyOf:
            - $ref: '#/components/schemas/V1QueryTextPart'
            - $ref: '#/components/schemas/V1QueryFilesPart'
            - $ref: '#/components/schemas/V1QueryAboutPart'
          title: Parts
          type: array
      required:
      - thread_id
      - parts
      title: V1QueryRequest
      type: object
    V1QueryTextPart:
      properties:
        type:
          const: text
          default: text
          title: Type
          type: string
        text:
          description: User prompt text.
          title: Text
          type: string
      required:
      - text
      title: V1QueryTextPart
      type: object
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT containing `user_id`. Passed in the `Authorization` header.
tags:
- name: Threads v1
  description: Thread lifecycle, message history, context configuration, and run-recording
    endpoints.
- name: Query & Files v1
  description: Threads v1 file upload and proposal-oriented query endpoints.
- name: Legacy
  description: Deprecated pre-v1 endpoints retained for backward compatibility.
- name: Health
  description: Service liveness check.
x-socketio:
  path: /socket.io/
  auth:
    header: Authorization
    format: Bearer <jwt>
  rooms:
  - '{user_id}'
  - '{user_id}:{thread_id}'
  client_events:
    connect:
      description: Authenticate via HTTP Authorization header and join {user_id} room.
    disconnect:
      description: Leave user room on disconnect.
    join_room:
      payload:
        $ref: '#/components/schemas/SocketJoinRoomPayload'
    question:
      payload:
        $ref: '#/components/schemas/SocketQuestionPayload'
  server_events:
    response:
      payload:
        $ref: '#/components/schemas/SocketResponseEvent'
    update:
      payload:
        $ref: '#/components/schemas/SocketUpdateEvent'
    error:
      payload:
        $ref: '#/components/schemas/SocketErrorEvent'
