openapi: 3.1.0
info:
  title: Rejuve.Bio AI Assistant API
  description: 'Backend HTTP and real-time Socket.IO API for the Rejuve.Bio AI Assistant.


    ## Authentication

    All endpoints (except `GET /`) require a valid HS256 JWT in the `Authorization`
    header:

    `Authorization: Bearer <token>` (raw `<token>` without the `Bearer` prefix is
    also accepted by legacy clients).

    Missing or invalid tokens return HTTP `403` with `{"text": "Token is missing!"}`
    or `{"text": "Token is invalid!"}`.


    ## Rate Limiting

    SlowAPI applies a default limit of **200 requests/minute** per client IP (returns
    HTTP `429` when exceeded).


    ## Real-Time Socket.IO Protocol (`/socket.io/`)

    In addition to HTTP routes, the server exposes a Socket.IO ASGI endpoint mounted
    at `/socket.io/` (`app/socket_manager.py`).


    ### Connection & Authentication

    - **Path:** `/socket.io/`

    - **Header:** `Authorization: Bearer <token>` during the Socket.IO handshake.
    Invalid or missing tokens reject the connection (`connect` returns `false`).

    - On connect, the client is automatically joined to its personal room `{user_id}`
    and receives a `response` event: `{"message": "Connected successfully"}`.


    ### Client -> Server Events

    | Event | Payload Schema | Behavior |

    | --- | --- | --- |

    | `connect` | Handshake `Authorization` header | Authenticates JWT, saves session,
    auto-joins `{user_id}`, emits `response`. |

    | `disconnect` | — | Leaves `{user_id}` room and cleans up session. |

    | `join_room` | `SocketJoinRoomPayload` (`{"thread_id": "..."}`) | Joins room
    `{user_id}:{thread_id}` (or `{user_id}` if omitted) and emits `response`. |

    | `question` | `SocketQuestionPayload` (`{"question": "...", "thread_id": "..."}`)
    | Acquires per-thread Redis lock, invokes the orchestrator, and emits progress
    `update` events followed by `response` (`status: "completed"`) to the room. |


    ### Server -> Client Events

    | Event | Payload Schema | When Emitted |

    | --- | --- | --- |

    | `response` | `SocketResponseEvent` | On `connect`, `join_room`, busy rejection
    (`status: "busy"`), or final `question` completion (`status: "completed"`). |

    | `update` | `SocketUpdateEvent` | Intermediate progress/status updates streamed
    while processing a `question`. |

    | `error` | `SocketErrorEvent` | Validation errors (missing/empty `question`)
    or unhandled processing exceptions. |'
  version: 1.0.0
paths:
  /query:
    post:
      tags:
      - Legacy
      summary: Unified legacy query and PDF upload endpoint
      description: "Unified question answering endpoint for the Rejuve platform.\n\
        \n- Accepts form data.\n- Required fields:\n    - user_id: The user's identifier\
        \ (string).\n    - question: The user's question or prompt (string).\n   \
        \ - context: JSON string with keys:\n        - id: For content queries, a\
        \ list of content IDs; for other resources, a single ID.\n        - resource:\
        \ The type of resource (e.g., 'content', 'annotation', 'hypothesis').\n  \
        \  - graph, json_query: Optional, for advanced queries.\n    - resume: Optional.\
        \ The exact `value` of a button clicked in response to a\n      `needs_confirmation`\
        \ reply's `confirmation.options` (e.g. \"confirm\",\n      \"reject\", or\
        \ a specific candidate name) — a deterministic, validated\n      answer to\
        \ a pending confirmation. Mutually distinct from `question`:\n      free text\
        \ always goes through `question` and is interpreted as before;\n      `resume`\
        \ is only ever one of the exact offered option values.\n    - thread_id: REQUIRED.\
        \ Which conversation this message belongs to — the\n      client picks it\
        \ (e.g. a new UUID generated at \"New Chat\") and sends the\n      same value\
        \ with every message in that conversation. Requests without it\n      are\
        \ rejected with 400; there is deliberately no implicit fallback, so a\n  \
        \    client can't silently end up with every conversation sharing one thread.\n\
        \      Scopes both the checkpointer (pause/resume state) and the durable\n\
        \      conversation thread (messages + tool-call references).\n- For content\
        \ queries (resource == 'content'), content_ids are extracted from context['id'].\n\
        - If content_ids are provided, answers are retrieved only from those content\
        \ items. If omitted, any content_ids this thread has already\n  uploaded or\
        \ referenced are recalled automatically; only a thread with no such history\
        \ falls back to the general collection.\n- Handles both user-uploaded content\
        \ question answering and general knowledge queries."
      operationId: process_query_query_post
      deprecated: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_process_query_query_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyQueryResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '400':
          description: Missing thread_id or missing input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '404':
          description: Thread belongs to a different user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '409':
          description: Thread is currently processing another request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyBusyResponse'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /user_status/documents/:
    get:
      tags:
      - Legacy
      summary: List uploaded PDF and web documents for a user
      description: 'Returns counts and metadata for the authenticated user''s uploaded
        PDF and web documents. Note: the handler declares an optional legacy `user_id`
        form parameter, defaulting to the JWT `user_id`.'
      operationId: user_status_user_status_documents__get
      deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusDocumentsResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '400':
          description: Missing user_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /clear_user_data:
    delete:
      tags:
      - Legacy
      summary: Delete all stored documents, history, and Qdrant collection for a user
      operationId: clear_user_data_clear_user_data_delete
      deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '400':
          description: Missing user_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /delete_content:
    delete:
      tags:
      - Legacy
      summary: Delete a single uploaded PDF or web content item
      operationId: delete_content_delete_content_delete
      deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '400':
          description: Missing user_id or content_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '404':
          description: Content not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /audio/summary:
    get:
      tags:
      - Legacy
      summary: Generate or serve cached TTS audio for a content summary
      description: 'Returns `audio/mpeg` bytes for a document''s stored summary (cached
        in Redis for 10 minutes). Note: the handler currently reads `content_id` as
        a legacy `Form(None)` parameter.'
      operationId: get_summary_audio_audio_summary_get
      deprecated: true
      responses:
        '200':
          description: Generated MPEG audio stream.
          content:
            application/json:
              schema: {}
            audio/mpeg:
              schema:
                type: string
                format: binary
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '400':
          description: Missing user_id or content_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '404':
          description: Content or summary not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /audio/query:
    get:
      tags:
      - Legacy
      summary: Generate or serve cached TTS audio for a historical query answer
      description: 'Returns `audio/mpeg` bytes for a saved conversation answer (cached
        in Redis for 10 minutes). Note: the handler currently reads `query_id` as
        a legacy `Form(None)` parameter.'
      operationId: get_query_audio_audio_query_get
      deprecated: true
      responses:
        '200':
          description: Generated MPEG audio stream.
          content:
            application/json:
              schema: {}
            audio/mpeg:
              schema:
                type: string
                format: binary
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '400':
          description: Missing user_id or query_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '404':
          description: Query or answer text not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /history:
    get:
      tags:
      - Legacy
      summary: Retrieve recent legacy conversation history for a user
      description: 'Returns a JSON object keyed by `user_id` mapping to up to 5 recent
        history entries. Note: the handler declares an optional legacy `user_id` `Form(None)`
        parameter.'
      operationId: get_user_history_history_get
      deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/LegacyHistoryEntry'
                title: Response Get User History History Get
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
    delete:
      tags:
      - Legacy
      summary: Clear legacy conversation history for a user
      operationId: clear_user_history_history_delete
      deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /faq:
    get:
      tags:
      - Legacy
      summary: Get welcome message and sample FAQ questions
      description: Returns seeded FAQ prompts for the given `context`. When `context=hypothesis`,
        queries the external hypothesis projects API and generates sample questions
        via the LLM (may return `null` if unavailable).
      operationId: get_faq_intro_faq_get
      deprecated: true
      parameters:
      - name: context
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/FaqIntroResponse'
                - $ref: '#/components/schemas/HypothesisFaqResponse'
                - type: 'null'
                title: Response Get Faq Intro Faq Get
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /faq/{question_id}:
    get:
      tags:
      - Legacy
      summary: Get pre-populated FAQ answer by question ID
      description: 'Get answer for a FAQ question from MongoDB.

        Returns pre-populated answer instantly.'
      operationId: get_faq_answer_faq__question_id__get
      deprecated: true
      parameters:
      - name: question_id
        in: path
        required: true
        schema:
          type: string
          title: Question Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqAnswerResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorResponse'
        '404':
          description: Question ID not found in FAQ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqNotFoundResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/threads:
    get:
      tags:
      - Threads v1
      summary: List threads for the authenticated user
      description: 'Thread summaries for the authenticated user, latest activity first.

        Read-only -- exposes the existing conversation_threads data, no new

        storage introduced. See the Threads API v1 proposal.'
      operationId: list_threads_v1_threads_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadListResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Failed to list threads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/threads/{thread_id}:
    get:
      tags:
      - Threads v1
      summary: Get a single thread summary
      description: 'A single thread''s summary. 404 if it doesn''t belong to this
        user --

        another user''s thread_id counts as missing, same as the v1 proposal''s

        error convention.'
      operationId: get_thread_v1_threads__thread_id__get
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread (or message) not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Upstream storage or model error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
    patch:
      tags:
      - Threads v1
      summary: Rename a thread or reset its custom title
      operationId: rename_thread_v1_threads__thread_id__patch
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread (or message) not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Upstream storage or model error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: New custom thread title (or null/empty to clear).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameThreadRequest'
      security:
      - BearerAuth: []
    delete:
      tags:
      - Threads v1
      summary: Delete a thread
      operationId: delete_thread_route_v1_threads__thread_id__delete
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '204':
          description: Thread deleted.
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread (or message) not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Upstream storage or model error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/threads/{thread_id}/messages:
    get:
      tags:
      - Threads v1
      summary: List ordered messages in a thread
      description: 'A thread''s messages, oldest first, read from the existing stored

        turns. Each message''s id is built from its stable, stored `seq`

        (see _format_v1_message) -- read-only, no schema change.'
      operationId: get_thread_messages_v1_threads__thread_id__messages_get
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMessageListResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread (or message) not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Upstream storage or model error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
    post:
      tags:
      - Threads v1
      summary: Record an executed run message and its output files on a thread
      operationId: record_thread_run_v1_threads__thread_id__messages_post
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Message'
        '200':
          description: Idempotent replay when client_message_id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '400':
          description: Missing or multiple 'run' parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread (or message) not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Upstream storage or model error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: Run status message containing one 'run' part and optional 'files'
          output part.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordThreadRunRequest'
      security:
      - BearerAuth: []
  /v1/files:
    post:
      tags:
      - Query & Files v1
      summary: Upload raw files for use in /v1/query
      description: 'Accept and store one or more files, per-user, no embedding --
        step 1

        only (RAG embedding is a separate, later decision). Returns {id, name}

        per file so the client can reference them in a ''files'' part on

        /v1/query right away.'
      operationId: post_v1_files_v1_files_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_post_v1_files_v1_files_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FilesUploadResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '400':
          description: No file in the upload succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FilesUploadErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/query:
    post:
      tags:
      - Query & Files v1
      summary: Send a Threads v1 message (propose-only)
      description: 'Send a message. Unlike /query, this never executes anything --
        it

        only proposes (annotation only, in v1). Matches ''Send a message'' in

        the Threads API v1 proposal.


        Accepts either application/json (unchanged), or multipart/form-data

        with a "body" field holding the same JSON plus the actual file(s)

        attached in the same request -- lets a client attach a brand-new file

        and send the message in one round trip instead of always needing a

        separate /v1/files upload first. A files part entry can still name an

        already-uploaded file by "id" (unchanged) or, only in the multipart

        case, by "name" to match one of the files attached to this request.'
      operationId: post_v1_query_v1_query_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Message'
        '200':
          description: Idempotent replay for an existing client_message_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Message'
        '400':
          description: Invalid thread_id, parts, context, or file reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread belongs to a different user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '409':
          description: A reply is already in progress in this thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Model or tool execution failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: Send either `application/json` matching `V1QueryRequest`, or
          `multipart/form-data` with a `body` JSON string plus attached file parts
          referenced by `name` in the `files` part.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1QueryRequest'
          multipart/form-data:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  description: JSON-serialized V1QueryRequest payload.
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more attached files matched by filename.
      security:
      - BearerAuth: []
  /v1/threads/{thread_id}/context:
    put:
      tags:
      - Threads v1
      summary: Set or update a thread's species, sources, and context resources
      operationId: put_thread_context_v1_threads__thread_id__context_put
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Message'
        '204':
          description: Context matched the existing thread context; no change recorded.
        '400':
          description: Invalid species, sources, or resources payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread (or message) not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Upstream storage or model error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: Species, optional source list, and optional resource references.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadContextUpdateRequest'
      security:
      - BearerAuth: []
  /v1/threads/{thread_id}/messages/{message_id}:
    delete:
      tags:
      - Threads v1
      summary: Delete a single message from a thread
      operationId: delete_thread_message_v1_threads__thread_id__messages__message_id__delete
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
          title: Thread Id
      - name: message_id
        in: path
        required: true
        schema:
          type: string
          title: Message Id
      responses:
        '204':
          description: Message deleted.
        '403':
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '404':
          description: Thread (or message) not found for this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '502':
          description: Upstream storage or model error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /:
    get:
      tags:
      - Health
      summary: Health check
      operationId: health_check__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                title: Response Health Check  Get
      security: []
